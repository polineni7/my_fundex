name: Validate
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test backend/MyFundex.sln --configuration Release
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [agent-ui, admin-manager-ui]
    defaults:
      run:
        working-directory: ui/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
