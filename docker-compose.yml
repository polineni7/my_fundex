services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: my_fundex
      POSTGRES_USER: myfundex
      POSTGRES_PASSWORD: myfundex_dev
    ports: ["5432:5432"]
    volumes: ["myfundex_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfundex -d my_fundex"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["myfundex_redis:/data"]
volumes:
  myfundex_pg:
  myfundex_redis:
